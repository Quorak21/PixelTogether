    <!-- Web Analytics Vercel : pages vues. Les sessions en direct sont filtrées. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      window.va('beforeSend', function (event) {
        var path = '';
        try {
          path = new URL(event.url, 'https://www.pixeltogether.ch').pathname;
        } catch (e) {
          return event;
        }
        if (/^\/(room|lobby|session)(\/|$)/.test(path)) {
          return null;
        }
        return event;
      });
    </script>
